name: sline
description: SLine messenger
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  firebase_database: ^11.2.0
  firebase_messaging: ^15.1.6

  http: ^1.2.2
  crypto: ^3.0.6
  url_launcher: ^6.3.1

  image_picker: ^1.1.2
  path_provider: ^2.1.5
  permission_handler: ^11.4.0
  record: ^6.0.0
  audioplayers: ^6.1.0
  video_player: ^2.9.2
  camera: ^0.11.0

  file_selector: ^1.0.3
  photo_manager: ^3.6.4
  flutter_webrtc: ^0.12.1

  onesignal_flutter: ^5.2.9
  liquid_glass_easy: ^4.3.4
  liquid_glass_widgets: ^1.9.0
  telegram_nav_bar: ^0.2.1
  frost_nav_bar: ^0.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

dependency_overrides:
  camera_android_camerax: 0.7.4+6

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
    - assets/wallpapers/chat_doodle.jpg
    - assets/wallpapers/chat_doodle_dark.jpg

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#4C7CF3"
  adaptive_icon_foreground: assets/icon/app_icon.png
