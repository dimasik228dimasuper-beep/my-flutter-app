      - name: Build IPA
        env:
          BUILD_ID: ${{ steps.params.outputs.build_id }}
          IOS_PATH: ${{ steps.params.outputs.ios_path }}
          SCHEME: ${{ steps.params.outputs.scheme }}
          PROJECT_TYPE: ${{ steps.detect.outputs.type }}
          USE_SIGNING: ${{ steps.params.outputs.use_signing }}
          CONFIGURATION: ${{ steps.params.outputs.configuration }}
          BUILD_NUMBER: ${{ steps.params.outputs.build_number }}
          DISTRIBUTION: ${{ steps.params.outputs.distribution }}
        run: |
          set -e
          fail() { echo "::error::$*" >&2; exit 1; }

          # Writes the manual signing settings (team, profile and identity from the
          # environment) into the application targets of ./*.xcodeproj that the
          # profile's app id ($1, "*" wildcards) covers, and into every extension target
          # with the EXTENSION_PROFILES entry (bundle id to name) covering its bundle
          # id, as an XML plist Xcode reads. On the xcodebuild command line they would
          # apply to every target, and a CocoaPods framework target refuses a profile.
          apply_signing_to_app_target() {
            local projects=(*.xcodeproj) out
            [ -d "${projects[0]}" ] || fail "No .xcodeproj in $PWD to apply the signing settings to"
            out=$(python3 - "$1" "${projects[@]}" 2>&1 <<'PY'
          import json, os, subprocess, sys
          app_id, projects = sys.argv[1], sys.argv[2:]
          settings = {'CODE_SIGN_STYLE': 'Manual', 'DEVELOPMENT_TEAM': os.environ['DEVELOPMENT_TEAM'],
                      'PROVISIONING_PROFILE_SPECIFIER': os.environ['PROVISIONING_PROFILE_NAME'],
                      'CODE_SIGN_IDENTITY': os.environ['CODE_SIGN_IDENTITY']}
          extension_profiles = json.loads(os.environ.get('EXTENSION_PROFILES') or '{}')
          # The same list as ExtensionProductTypes in internal/xcodeproj.
          extension_types = {'com.apple.product-type.app-extension', 'com.apple.product-type.app-extension.messages',
                             'com.apple.product-type.extensionkit-extension', 'com.apple.product-type.application.watchapp2',
                             'com.apple.product-type.watchkit2-extension', 'com.apple.product-type.application.on-demand-install-capable'}

          def covers(pattern, bundle_id):
              if pattern.endswith('*'):
                  return bundle_id.startswith(pattern[:-1])
              return bundle_id == pattern

          apps, extensions, plists = [], [], {}
          for project in projects:
              path = os.path.join(project, 'project.pbxproj')
              plists[project] = json.loads(subprocess.check_output(['plutil', '-convert', 'json', '-o', '-', path]))
              objects = plists[project]['objects']
              for target in objects.values():
                  kind = target.get('productType')
                  if target.get('isa') != 'PBXNativeTarget' or (kind != 'com.apple.product-type.application' and kind not in extension_types):
                      continue
                  configs = [objects[c] for c in objects[target['buildConfigurationList']]['buildConfigurations']]
                  ids = sorted({c.setdefault('buildSettings', {}).get('PRODUCT_BUNDLE_IDENTIFIER', '') for c in configs})
                  (apps if kind == 'com.apple.product-type.application' else extensions).append((project, target['name'], configs, ids))
          if not apps:
              sys.exit('No application target in %s to apply the signing settings to' % ', '.join(projects))
          chosen = apps if len(apps) == 1 else [a for a in apps if any(covers(app_id, i) for i in a[3])]
          if not chosen:
              found = '; '.join('%s in %s (%s)' % (name, project, ', '.join(i or '?' for i in ids)) for project, name, _, ids in apps)
              sys.exit('No application target has the PRODUCT_BUNDLE_IDENTIFIER the provisioning profile covers (%s): %s' % (app_id, found))
          chosen = [a + (settings['PROVISIONING_PROFILE_SPECIFIER'],) for a in chosen]
          # An extension is signed with the most specific profile covering it; the app's never does.
          missing = []
          for project, name, configs, ids in extensions:
              names = [extension_profiles[p] for p in sorted(extension_profiles, key=len, reverse=True) if any(covers(p, i) for i in ids)]
              if names:
                  chosen.append((project, name, configs, ids, names[0]))
              else:
                  missing.append('%s in %s (%s)' % (name, project, ', '.join(i or '?' for i in ids)))
          if missing:
              sys.exit('No provisioning profile for extension target %s. Add each bundle id to ios.extensions in builder.json and run builder signing setup --distribution %s.' % ('; '.join(missing), os.environ.get('DISTRIBUTION') or '<distribution>'))
          for project, name, configs, _, profile in chosen:
              for config in configs:
                  build = config['buildSettings']
                  # A conditional setting (CODE_SIGN_IDENTITY[sdk=iphoneos*]) would win over the plain one.
                  for key in [k for k in build if k.split('[')[0] in settings]:
                      del build[key]
                  build.update(settings)
                  build['PROVISIONING_PROFILE_SPECIFIER'] = profile
              print('Signing settings applied to target %s in %s: %s (profile %s)' % (name, project, ', '.join(c['name'] for c in configs), profile))
          for project in sorted({a[0] for a in chosen}):
              subprocess.run(['plutil', '-convert', 'xml1', '-o', os.path.join(project, 'project.pbxproj'), '-'],
                             input=json.dumps(plists[project]).encode(), check=True)
          PY
            ) || fail "$out"
            echo "$out"
          }

          # BUILD_NUMBER is "N" or "X.Y.Z+N" (pubspec convention); sets build_number,
          # build_name and version_settings for xcodebuild. Given a target and scheme
          # it also rewrites an Info.plist that hardcodes CFBundleVersion, which
          # CURRENT_PROJECT_VERSION never reaches; identical in ios-build.yml and runner.sh.
          apply_build_number() {
            build_number="" build_name="" version_settings=""
            [ -n "${BUILD_NUMBER:-}" ] || return 0
            if ! [[ "$BUILD_NUMBER" =~ ^([0-9]+(\.[0-9]+)*\+)?[0-9]+(\.[0-9]+)*$ ]]; then
              echo "BUILD_NUMBER must be N or X.Y.Z+N, got '$BUILD_NUMBER'" >&2
              return 1
            fi
            build_number="${BUILD_NUMBER##*+}"
            case "$BUILD_NUMBER" in *+*) build_name="${BUILD_NUMBER%+*}" ;; esac
            version_settings="CURRENT_PROJECT_VERSION=$build_number${build_name:+ MARKETING_VERSION=$build_name}"
            echo "Build number: $build_number${build_name:+ (version $build_name)}"
            [ $# -gt 0 ] || return 0
            plist=$(xcodebuild "$@" -showBuildSettings -json 2>/dev/null \
              | jq -r 'map(.buildSettings)
                       | map(select(.PRODUCT_TYPE == "com.apple.product-type.application" and .INFOPLIST_FILE != null and .INFOPLIST_FILE != ""))
                       | map(.SRCROOT + "/" + .INFOPLIST_FILE) | first // empty' || true)
            if [ -z "$plist" ] || [ ! -f "$plist" ]; then
              echo "No Info.plist file in the app target; CFBundleVersion comes from CURRENT_PROJECT_VERSION"
              return 0
            fi
            current=$(plutil -extract CFBundleVersion raw -o - "$plist" 2>/dev/null || true)
            case "$current" in
              '$(CURRENT_PROJECT_VERSION)'|'${CURRENT_PROJECT_VERSION}'|'$(FLUTTER_BUILD_NUMBER)'|'${FLUTTER_BUILD_NUMBER}')
                echo "$plist reads CFBundleVersion from $current" ;;
              *)
                echo "$plist hardcodes CFBundleVersion '$current'; setting $build_number in the plist"
                plutil -replace CFBundleVersion -string "$build_number" "$plist" ;;
            esac
            [ -n "$build_name" ] || return 0
            current=$(plutil -extract CFBundleShortVersionString raw -o - "$plist" 2>/dev/null || true)
            case "$current" in
              '$(MARKETING_VERSION)'|'${MARKETING_VERSION}'|'$(FLUTTER_BUILD_NAME)'|'${FLUTTER_BUILD_NAME}') ;;
              *)
                echo "$plist hardcodes CFBundleShortVersionString '$current'; setting $build_name in the plist"
                plutil -replace CFBundleShortVersionString -string "$build_name" "$plist" ;;
            esac
          }

          # Writes the export options ($1) with the same manual signing as the archive:
          # the app's real bundle id (APP_BUNDLE_ID) maps to its profile and every
          # extension keeps its own from EXTENSION_PROFILES.
          write_export_options() {
            python3 - "$1" <<'PY'
          import json, os, plistlib, sys
          options = {'method': os.environ['EXPORT_METHOD'], 'signingStyle': 'manual',
                     'teamID': os.environ['DEVELOPMENT_TEAM'],
                     'provisioningProfiles': {os.environ['APP_BUNDLE_ID']: os.environ['PROVISIONING_PROFILE_NAME']}}
          options['provisioningProfiles'].update(json.loads(os.environ.get('EXTENSION_PROFILES') or '{}'))
          # Distribution exports keep the version numbers the archive was built with;
          # Xcode would otherwise renumber the build on export.
          if options['method'] != 'development':
              options['manageAppVersionAndBuildNumber'] = False
          with open(sys.argv[1], 'wb') as out:
              plistlib.dump(options, out)
          PY
          }

          # Navigate to iOS project
          cd "$IOS_PATH"

          # Find workspace or project
          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" | head -1)
          PROJECT=$(find . -maxdepth 1 -name "*.xcodeproj" | head -1)

          # Install pods if Podfile exists (always run to ensure sync with Podfile.lock)
          if [ -f "Podfile" ]; then
            echo "Running pod install..."
            pod install
            WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" | head -1)
          fi

          if [ -n "$WORKSPACE" ]; then
            TARGET_FLAG=-workspace
            TARGET_PATH=$WORKSPACE
          else
            TARGET_FLAG=-project
            TARGET_PATH=$PROJECT
          fi

          # Determine scheme (only needed for native projects)
          if [ -z "$SCHEME" ] && [ "$PROJECT_TYPE" = "native" ]; then
            if [ -n "$WORKSPACE" ]; then
              BASE=$(basename "$WORKSPACE" .xcworkspace)
            else
              BASE=$(basename "$PROJECT" .xcodeproj)
            fi

            SCHEMES=$(xcodebuild "$TARGET_FLAG" "$TARGET_PATH" -list -json 2>/dev/null | jq -r '(.workspace // .project).schemes[]?' || true)
            if [ -z "$SCHEMES" ]; then
              SCHEMES=$(xcodebuild "$TARGET_FLAG" "$TARGET_PATH" -list 2>/dev/null | sed -n '/Schemes:/,$p' | tail -n +2 | sed 's/^[[:space:]]*//' | sed '/^$/d' || true)
            fi
            echo "Schemes:"
            printf '%s\n' "$SCHEMES" | sed 's/^/  /'

            # In a workspace, the scheme list also holds package and pod
            # schemes, and they sort ahead of the app as often as not. The
            # scheme named after the project is the app in nearly every repo.
            SCHEME=$(printf '%s\n' "$SCHEMES" | grep -Fx "$BASE" | head -1 || true)
            if [ -z "$SCHEME" ]; then
              SCHEME=$(printf '%s\n' "$SCHEMES" | grep -v '^Pods-' | while IFS= read -r s; do
                [ -n "$s" ] || continue
                # A scheme that belongs to a local Swift package is not the app.
                [ -z "$(find . -maxdepth 4 -path "*/$s/Package.swift" -print -quit)" ] || continue
                printf '%s\n' "$s"
                break
              done)
            fi
            echo "Building with scheme: $SCHEME (configuration: $CONFIGURATION)"
          fi

          if [ "$PROJECT_TYPE" = "native" ]; then
            if [ -z "$WORKSPACE" ] && [ -z "$PROJECT" ]; then
              echo "::error::No .xcworkspace or .xcodeproj found in '$IOS_PATH'. If the project is generated (XcodeGen/Tuist), commit it or add a generation step."
              exit 1
            fi
            if [ -z "$SCHEME" ]; then
              echo "::error::Could not determine a scheme. Pass one via the 'scheme' input, or make sure the project has a shared scheme."
              exit 1
            fi
          fi

          # Use custom DerivedData path for caching
          DERIVED_DATA_PATH="${GITHUB_WORKSPACE}/DerivedData"

          if [ "$PROJECT_TYPE" = "flutter" ]; then
            cd "$GITHUB_WORKSPACE"
            apply_build_number
            FLUTTER_VERSION_FLAGS=""
            if [ -n "$build_number" ]; then
              FLUTTER_VERSION_FLAGS="--build-number=$build_number${build_name:+ --build-name=$build_name}"
            fi
            # --config-only writes Generated.xcconfig and
            # flutter_export_environment.sh without invoking Xcode; the
            # xcodebuild below (or the archive, when signing) does the build.
            if [ "$CONFIGURATION" = "Debug" ]; then
              echo "Generating Flutter iOS Debug config..."
              flutter build ios --debug --config-only $FLUTTER_VERSION_FLAGS
            else
              echo "Generating Flutter iOS Release config..."
              flutter build ios --release --config-only $FLUTTER_VERSION_FLAGS
            fi
            cd "$IOS_PATH"

            # flutter build ios --no-codesign не отключает подпись полностью:
            # Xcode всё равно подписывает нативные расширения (OneSignal, FCM).
            # С --config-only Xcode вообще не запускается, поэтому единственная
            # сборка здесь — этот xcodebuild, и он же гасит подпись.
            if [ "$USE_SIGNING" != "true" ]; then
              if [ -n "$WORKSPACE" ]; then
                XC_TARGET="-workspace $WORKSPACE"
              elif [ -n "$PROJECT" ]; then
                XC_TARGET="-project $PROJECT"
              else
                XC_TARGET=""
              fi
              if [ -n "$XC_TARGET" ]; then
                echo "Building unsigned via xcodebuild..."
                xcodebuild $XC_TARGET \
                  -scheme "${SCHEME:-Runner}" \
                  -configuration "$CONFIGURATION" \
                  -destination 'generic/platform=iOS' \
                  -derivedDataPath "$DERIVED_DATA_PATH" \
                  CODE_SIGNING_ALLOWED=NO \
                  CODE_SIGNING_REQUIRED=NO \
                  CODE_SIGN_IDENTITY="" \
                  COMPILER_INDEX_STORE_ENABLE=NO \
                  build
              fi
            fi

            if [ "$USE_SIGNING" = "true" ]; then
              # 'flutter build ios --config-only' never signs, so archive the
              # Runner project it generated. The IPA step below exports
              # build/App.xcarchive whenever signing is on.
              ARCHIVE_CMD="xcodebuild"
              if [ -n "$WORKSPACE" ]; then
                ARCHIVE_CMD="$ARCHIVE_CMD -workspace '$WORKSPACE'"
              elif [ -n "$PROJECT" ]; then
                ARCHIVE_CMD="$ARCHIVE_CMD -project '$PROJECT'"
              else
                echo "::error::Signing requested but no Runner workspace/project found in '$IOS_PATH'."
                exit 1
              fi

              # Flutter wrote the build number into Generated.xcconfig; this
              # only catches a Runner Info.plist that hardcodes it.
              apply_build_number "$TARGET_FLAG" "$TARGET_PATH" -scheme "${SCHEME:-Runner}"
              ARCHIVE_CMD="$ARCHIVE_CMD -scheme '${SCHEME:-Runner}'"
              ARCHIVE_CMD="$ARCHIVE_CMD -configuration '$CONFIGURATION'"
              ARCHIVE_CMD="$ARCHIVE_CMD -destination 'generic/platform=iOS'"
              ARCHIVE_CMD="$ARCHIVE_CMD -derivedDataPath '$DERIVED_DATA_PATH'"
              ARCHIVE_CMD="$ARCHIVE_CMD COMPILER_INDEX_STORE_ENABLE=NO $version_settings"
              ARCHIVE_CMD="$ARCHIVE_CMD -quiet"
              ARCHIVE_CMD="$ARCHIVE_CMD -archivePath '$GITHUB_WORKSPACE/build/App.xcarchive' archive"

              # The manual signing settings go on the Runner target, after
              # flutter build ios has regenerated the project.
              apply_signing_to_app_target "$PROFILE_BUNDLE_ID"
              echo "Running: $ARCHIVE_CMD"
              eval $ARCHIVE_CMD
            fi
          elif [ "$PROJECT_TYPE" = "reactnative" ] || [ "$PROJECT_TYPE" = "expo" ] || [ "$PROJECT_TYPE" = "kmp" ]; then
            # Use xcodebuild directly for React Native/Expo and Kotlin Multiplatform.
            # For KMP, the Xcode build phase (or CocoaPods) invokes Gradle to
            # compile the shared Kotlin framework, so the JDK must be on PATH.
            if [ "$PROJECT_TYPE" = "kmp" ]; then
              echo "Building Kotlin Multiplatform iOS ($CONFIGURATION)..."
              if [ -f "${GITHUB_WORKSPACE}/gradlew" ]; then
                chmod +x "${GITHUB_WORKSPACE}/gradlew"
              fi
            else
              echo "Building React Native iOS ($CONFIGURATION)..."
            fi
            BUILD_CMD="xcodebuild"
            if [ -n "$WORKSPACE" ]; then
              BUILD_CMD="$BUILD_CMD -workspace $WORKSPACE"
            elif [ -n "$PROJECT" ]; then
              BUILD_CMD="$BUILD_CMD -project $PROJECT"
            fi

            # Auto-detect scheme from workspace/project name (e.g., MyApp.xcworkspace -> MyApp)
            # unless an explicit scheme was provided.
            if [ -z "$SCHEME" ]; then
              if [ -n "$WORKSPACE" ]; then
                SCHEME=$(basename "$WORKSPACE" .xcworkspace)
              elif [ -n "$PROJECT" ]; then
                SCHEME=$(basename "$PROJECT" .xcodeproj)
              fi
            fi

            apply_build_number "$TARGET_FLAG" "$TARGET_PATH" -scheme "$SCHEME"
            BUILD_CMD="$BUILD_CMD -scheme '$SCHEME'"
            BUILD_CMD="$BUILD_CMD -configuration '$CONFIGURATION'"
            BUILD_CMD="$BUILD_CMD -destination 'generic/platform=iOS'"
            BUILD_CMD="$BUILD_CMD -derivedDataPath '$DERIVED_DATA_PATH'"
            BUILD_CMD="$BUILD_CMD COMPILER_INDEX_STORE_ENABLE=NO $version_settings"
            BUILD_CMD="$BUILD_CMD -quiet"

            if [ "$USE_SIGNING" = "true" ]; then
              # Must archive, not build: the IPA step below exports
              # build/App.xcarchive whenever signing is on. The signing settings
              # go on the app target now that pod install has generated the project.
              apply_signing_to_app_target "$PROFILE_BUNDLE_ID"
              BUILD_CMD="$BUILD_CMD -archivePath '$GITHUB_WORKSPACE/build/App.xcarchive' archive"
            else
              BUILD_CMD="$BUILD_CMD CODE_SIGNING_ALLOWED=NO build"
            fi

            echo "Running: $BUILD_CMD"
            eval $BUILD_CMD
          else
            BUILD_CMD="xcodebuild"
            if [ -n "$WORKSPACE" ]; then
              BUILD_CMD="$BUILD_CMD -workspace $WORKSPACE"
            elif [ -n "$PROJECT" ]; then
              BUILD_CMD="$BUILD_CMD -project $PROJECT"
            fi

            apply_build_number "$TARGET_FLAG" "$TARGET_PATH" -scheme "$SCHEME"
            BUILD_CMD="$BUILD_CMD -scheme '$SCHEME'"
            BUILD_CMD="$BUILD_CMD -configuration '$CONFIGURATION'"
            BUILD_CMD="$BUILD_CMD -destination 'generic/platform=iOS'"
            BUILD_CMD="$BUILD_CMD -derivedDataPath '$DERIVED_DATA_PATH'"
            BUILD_CMD="$BUILD_CMD $version_settings"

            # Speed optimization flags
            BUILD_CMD="$BUILD_CMD COMPILER_INDEX_STORE_ENABLE=NO"
            BUILD_CMD="$BUILD_CMD DEBUG_INFORMATION_FORMAT=dwarf"
            BUILD_CMD="$BUILD_CMD ONLY_ACTIVE_ARCH=YES"
            BUILD_CMD="$BUILD_CMD -quiet"

            # Xcode 16+ native compilation caching
            BUILD_CMD="$BUILD_CMD SWIFT_ENABLE_COMPILE_CACHE=YES"
            BUILD_CMD="$BUILD_CMD CLANG_ENABLE_COMPILE_CACHE=YES"

            if [ "$USE_SIGNING" = "true" ]; then
              # For signed builds, use archive. Automatic signing cannot resolve a
              # team on a runner (no Xcode account), so sign the app target
              # manually against the profile installed above.
              apply_signing_to_app_target "$PROFILE_BUNDLE_ID"
              BUILD_CMD="$BUILD_CMD -archivePath '$GITHUB_WORKSPACE/build/App.xcarchive' archive"
            else
              # For unsigned builds, use faster 'build' action
              BUILD_CMD="$BUILD_CMD CODE_SIGNING_ALLOWED=NO build"
            fi

            echo "Running: $BUILD_CMD"
            eval $BUILD_CMD
          fi

          # Create IPA
          if [ "$USE_SIGNING" = "true" ]; then
            # For signed builds, use xcodebuild -exportArchive.
            # Everything below is relative to the repo root, which is also what
            # the upload-artifact step ("build/*.ipa") resolves against — do not
            # use "cd .." here, it breaks when ios_path is "." (native at root).
            cd "$GITHUB_WORKSPACE"

            # The export has to use the same manual signing as the archive, and
            # it needs the app's real bundle id to map it to the profile.
            APP_BUNDLE_ID=$(plutil -extract ApplicationProperties.CFBundleIdentifier raw -o - build/App.xcarchive/Info.plist)
            echo "Exporting $APP_BUNDLE_ID with profile '$PROVISIONING_PROFILE_NAME' (team $DEVELOPMENT_TEAM), method $EXPORT_METHOD"
            export APP_BUNDLE_ID
            write_export_options ExportOptions.plist

            xcodebuild -exportArchive \
              -archivePath build/App.xcarchive \
              -exportOptionsPlist ExportOptions.plist \
              -exportPath build/export

            # Move IPA to expected location
            mv build/export/*.ipa "build/$BUILD_ID.ipa"
            echo "Created signed IPA: build/$BUILD_ID.ipa"
          else
            # For unsigned builds, find .app and create IPA
            if [ "$PROJECT_TYPE" = "flutter" ]; then
              # Flutter outputs to build/ios/iphoneos/
              APP_PATH=$(find "${GITHUB_WORKSPACE}/build/ios/iphoneos" -name "*.app" -type d | head -1)
            else
              # Native and React Native/Expo use DerivedData. Ask the project
              # which bundle this scheme produces: the first .app under
              # Build/Products is the wrong one whenever the repo has more than
              # one app target.
              APP_PATH=$(xcodebuild "$TARGET_FLAG" "$TARGET_PATH" \
                -scheme "$SCHEME" \
                -configuration "$CONFIGURATION" \
                -destination 'generic/platform=iOS' \
                -derivedDataPath "$DERIVED_DATA_PATH" \
                -showBuildSettings -json 2>/dev/null \
                | jq -r 'map(.buildSettings)
                         | map(select(.PRODUCT_TYPE == "com.apple.product-type.application"
                                      and (.TARGET_BUILD_DIR | contains("-iphoneos"))))
                         | map(.TARGET_BUILD_DIR + "/" + .FULL_PRODUCT_NAME)
                         | first // empty' || true)
              if [ ! -d "$APP_PATH" ]; then
                APP_PATH=$(find "$DERIVED_DATA_PATH/Build/Products/${CONFIGURATION}-iphoneos" -maxdepth 1 -name "*.app" -type d -print -quit 2>/dev/null || true)
              fi
            fi

            if [ -z "$APP_PATH" ]; then
              echo "Error: Could not find .app"
              exit 1
            fi
            echo "Found app at: $APP_PATH"
            cd "$GITHUB_WORKSPACE"
            mkdir -p build/Payload
            cp -R "$APP_PATH" build/Payload/
            cd build
            zip -rq "$BUILD_ID.ipa" Payload
            rm -rf Payload
            echo "Created unsigned IPA: build/$BUILD_ID.ipa"
          fi